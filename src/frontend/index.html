<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Response Machine</title>

  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css"
        media="(prefers-color-scheme: light)">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css"
        media="(prefers-color-scheme: dark)">
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/http.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/xml.min.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/javascript.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/css.min.js"></script>

  <!-- code-input -->
  <script defer src="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.3/code-input.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.3/code-input.min.css"
        integrity="sha384-xZs4WJV8m+Jyr9x2myeMi0eUpnIaE1f5MOfUUE1B2D4aF1EAFTNXTPixqHqZtFxc" crossorigin="anonymous">

  <!-- custom -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/arrow.css">
  <link rel="stylesheet" href="css/copy-button.css">

  <script defer src="js/base64.js"></script>
  <script defer src="js/hljs-merge-plugin.js"></script>
  <script defer src="js/copy-button.js"></script>
  <script defer src="js/examples.js"></script>
  <script defer src="js/main.js"></script>

</head>
<body class="center-children-vertically">
<main>
  <div id="input">
    <div>
      <details>
        <summary>Options</summary>

        <fieldset id="input-options">
          <legend>Editor escape sequences</legend>
          <div>
            <input
              type="checkbox"
              id="unicode-esc-seq"
              checked
            />
            <label for="unicode-esc-seq"
            >Unicode codepoints -
              <kbd>\u[<i>X</i>]</kbd> (<i>X</i> is hex, 0
              &lt;= <i>X</i> &lt;= 10FFFF)</label
            >
          </div>
          <div>
            <input
              type="checkbox"
              id="manual-newlines-esc-seq"
            />
            <label for="manual-newlines-esc-seq"
            >Manual newlines - <kbd>\r</kbd>,
              <kbd>\n</kbd> (when enabled, visual newlines in editor have no
              effect on output)</label
            >
          </div>
        </fieldset>
        <fieldset>
          <legend>Syntax highlighting</legend>
          <div>
            <input
              type="checkbox"
              id="syntax-highlighting"
              checked
            />
            <label for="syntax-highlighting"
            >Enable <i>highlight.js</i> syntax highlighting</label
            >
          </div>
        </fieldset>
      </details>
    </div>
    <div>
      <label for="example-select">
        Choose an example response:
      </label>
      <div>
        <select id="example-select"></select>
      </div>
    </div>
    <div>
      <label>Response editor:</label>
      <div class="center-children-vertically">
        <code-input
          placeholder="Type your HTTP response here..."
          template="syntax-highlighted"
        ></code-input>
      </div>
      <div class="center-children-vertically">
        <span class="arrow arrow-down"></span>
      </div>
    </div>
  </div>
  <div id="output">
    <div class="copy-and-link-container">
      <button class="copy-button">
        <span class="button-text">📋 Copy response URL</span>
      </button>
      <a id="response-link" target="_blank"></a>
    </div>
  </div>
</main>
</body>
</html>
